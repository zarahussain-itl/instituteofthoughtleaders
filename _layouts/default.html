<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{%- if site.noindex %}
<meta name="robots" content="noindex, nofollow">
{%- endif %}
{% seo title=false %}
<title>{% if page.url == "/" %}{{ page.title }} | Institute of Thought Leaders{% else %}{{ page.title }} | ITL{% endif %}</title>
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap">
<style>
html{color-scheme:light}
body{margin:0;background:#FAF8F3;overflow-x:hidden}
a{color:#7A5C17}a:hover{color:#4F3B0E}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #C9A54E;outline-offset:3px}
h1,h2{text-wrap:balance}
.article-body{font-size:18px;line-height:1.75;color:#22211E}
.article-body>:first-child{margin-top:0}
.article-body p{margin:0 0 22px}
.article-body h2{margin:48px 0 16px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:30px;line-height:1.2;color:#111111}
.article-body h3{margin:36px 0 12px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:23px;line-height:1.3;color:#111111}
.article-body ul,.article-body ol{margin:0 0 24px;padding-left:24px}
.article-body li{margin-bottom:12px}
.article-body blockquote{margin:40px 0;padding:8px 0 8px 28px;border-left:3px solid #C9A54E;font-family:'Source Serif 4',Georgia,serif;font-size:25px;line-height:1.45;color:#111111}
.article-body blockquote p{margin:0}
.article-body img{max-width:100%;height:auto;display:block;margin:32px 0}
.article-body hr{border:0;border-top:1px solid #E4DED1;margin:48px 0}
.article-body table{border-collapse:collapse;width:100%;margin:0 0 24px;font-size:16px}
.article-body th,.article-body td{border:1px solid #E4DED1;padding:10px 12px;text-align:left;vertical-align:top}
.article-body th{background:#F1ECE0}
form label{min-width:0}
form input:not([type=checkbox]):not([type=radio]),form select,form textarea{min-width:0;width:100%;max-width:100%}
[role=region][tabindex]:focus-visible{outline:2px solid #C9A54E;outline-offset:3px}
.site-header-inner{max-width:1200px;margin:0 auto;padding:18px clamp(20px,5vw,64px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.site-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:15px;font-weight:500}
.site-nav a{color:#FAF8F3;text-decoration:none}
.site-nav a:hover{color:#C9A54E}
.site-nav a[aria-current=page]{color:#C9A54E}
.site-nav .nav-cta{display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 20px;background:#C9A54E;color:#111111;font-weight:700;border-radius:2px}
.site-nav .nav-cta:hover{color:#111111;background:#D8B865}
.menu-toggle{display:none;align-items:center;gap:10px;min-height:44px;padding:0 16px;background:transparent;color:#FAF8F3;border:1px solid #5C5A53;border-radius:2px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.menu-toggle-bars{display:inline-block;width:18px;height:2px;background:currentColor;box-shadow:0 -6px 0 currentColor,0 6px 0 currentColor}
@media (max-width:900px){
  .menu-toggle{display:inline-flex}
  .site-nav{display:none;flex-basis:100%;flex-direction:column;align-items:stretch;gap:0;font-size:17px}
  .site-nav.is-open{display:flex}
  .site-nav a{display:flex;align-items:center;min-height:48px;border-top:1px solid #2E2D29}
  .site-nav .nav-cta{justify-content:center;margin-top:16px;min-height:48px;border-top:0}
}
.form-status{margin:0;flex-basis:100%;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div style="font-family: Manrope, 'Helvetica Neue', sans-serif; color: #111111; background: #FAF8F3; min-height: 100vh">
{% include header.html %}
<main>
{{ content }}
</main>
{% include footer.html %}
</div>
<script>
(function () {
  var endpoint = {{ site.form_endpoint | default: "" | jsonify }};
  document.querySelectorAll('form').forEach(function (f) {
    var b = f.querySelector('button');
    if (!b) return;
    var msg = document.createElement('p');
    msg.className = 'form-status';
    msg.setAttribute('role', 'status');
    msg.hidden = true;
    b.insertAdjacentElement('afterend', msg);
    if (endpoint) {
      f.action = endpoint;
      f.method = 'POST';
      b.type = 'submit';
      var s = document.createElement('input');
      s.type = 'hidden'; s.name = '_subject';
      s.value = 'ITL website: ' + (f.getAttribute('data-form') || document.title);
      f.appendChild(s);
      var pg = document.createElement('input');
      pg.type = 'hidden'; pg.name = 'page'; pg.value = location.pathname;
      f.appendChild(pg);
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        b.disabled = true;
        fetch(endpoint, { method: 'POST', body: new FormData(f), headers: { Accept: 'application/json' } })
          .then(function (r) {
            msg.hidden = false;
            if (r.ok) { msg.textContent = 'Thank you. We have your details and will be in touch shortly.'; f.reset(); }
            else { msg.textContent = 'Sorry, that did not send. Please email info@instituteofthoughtleaders.com.'; }
          })
          .catch(function () { msg.hidden = false; msg.textContent = 'Sorry, that did not send. Please email info@instituteofthoughtleaders.com.'; })
          .finally(function () { b.disabled = false; });
      });
    } else {
      f.addEventListener('submit', function (e) { e.preventDefault(); });
      msg.textContent = 'This form is not connected yet. Please email info@instituteofthoughtleaders.com.';
      b.addEventListener('click', function () { msg.hidden = false; });
    }
  });
})();
</script>
</body>
</html>
