<header style="background: #111111; color: #FAF8F3">
<div class="site-header-inner">
<a href="{{ '/' | relative_url }}" aria-label="Institute of Thought Leaders home" style="display: flex; flex-direction: column; align-items: flex-start; text-decoration: none; color: #FAF8F3">
<span style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1">ITL</span>
<span style="display: block; width: 100%; height: 2px; background: #C9A54E; margin: 5px 0 4px"></span>
<span style="font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase">Institute of Thought Leaders</span>
</a>
<button type="button" class="menu-toggle" aria-expanded="false" aria-controls="site-nav"><span class="menu-toggle-bars" aria-hidden="true"></span>Menu</button>
<nav id="site-nav" class="site-nav" aria-label="Main">
{%- for item in site.data.nav %}
<a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.label }}</a>
{%- endfor %}
<a class="nav-cta" href="{{ '/program-preview/' | relative_url }}">Program preview</a>
</nav>
</div>
</header>
<script>
(function () {
  var b = document.querySelector('.menu-toggle'), n = document.getElementById('site-nav');
  b.addEventListener('click', function () {
    var open = n.classList.toggle('is-open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
